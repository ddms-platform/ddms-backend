name: CI/CD - Deploy BE to VM

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

# Push lien tiep vao cung mot nhanh thi huy luot cu, khoi ton phut chay
concurrency:
  group: be-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Chay o goc repo voi solution. Truoc day job nay dat
      # working-directory: ./DDMS.Backend nen `dotnet test` khong tim thay
      # project test nao - no exit 0 ma khong chay gi, deploy van di tiep
      # du test co hong.
      - name: Restore dependencies
        run: dotnet restore DDMS.Backend.slnx

      - name: Build
        run: dotnet build DDMS.Backend.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test DDMS.Backend.slnx --configuration Release --no-build --verbosity normal

  deploy:
    name: Deploy to VM
    needs: test
    # PR chi chay test, khong deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash ~/deploy.sh'

      # deploy.sh ket thuc ngay sau `docker run -d`, nen khong co buoc nay
      # thi container chet lien sau do van bao deploy thanh cong.
      - name: Kiem tra ung dung song sau deploy
        # Hardcode thay vi dung secrets.VM_HOST: chung chi TLS cap cho dung
        # domain nay, doi server la phai cap lai chung chi va sua ca dong nay.
        env:
          HEALTH_URL: https://13.211.76.82.nip.io/health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL"; then
              echo ""
              echo "Health check OK sau $i lan thu"
              exit 0
            fi
            echo "Lan $i chua len, doi 6s..."
            sleep 6
          done
          echo "Health check that bai sau 10 lan thu - container co the da chet"
          exit 1
